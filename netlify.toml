[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing on this site loads from another origin (fonts are self-hosted),
    # so the policy can simply be "same-origin only". The sha256 is the inline
    # theme/language bootstrap in index.html's <head>; if you edit that script
    # you MUST update this hash or the browser will silently refuse to run it.
    # Run ./tools-csp-hash.sh to print the new value.
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-EExPnGmixOuX4YJXs7WelZ2HWpvf6qMSmCben5y1SXg='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    # We use no camera/mic/geolocation/payment APIs — turn them all off.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"

# Fonts are content-addressed by name and never change in place; letting
# browsers and the CDN cache them hard avoids re-downloading 288KB.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
